name: self-test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the published package used by the action
        shell: bash
        run: python -m pip install --disable-pip-version-check "conereplay==0.1.2"
      - name: Run script tests
        shell: bash
        run: bash tests/run_all.sh

  replay:
    needs: tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Replay one trace file
        uses: ./
        with:
          traces: example/traces/refund-order-a.json
          modify: example/modify.json
          fail-on: never
      - name: Replay a directory of traces
        uses: ./
        with:
          traces: example/traces
          modify: example/modify.json
          fail-on: never
      - name: Replay a glob of traces
        uses: ./
        with:
          traces: example/traces/*.json
          modify: example/modify.json
          fail-on: never

  fork-fallback:
    if: github.event_name == 'pull_request'
    needs: replay
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Replay with a token that cannot write
        id: action
        uses: ./
        with:
          traces: example/traces/refund-order-a.json
          modify: example/modify.json
          fail-on: never
          comment: "true"
      - name: Comment URL stays empty without pull-requests write
        shell: bash
        env:
          COMMENT_URL: ${{ steps.action.outputs.comment-url }}
        run: |
          if [ -n "$COMMENT_URL" ]; then
            echo "expected no comment URL when the job token cannot write pull requests"
            echo "comment-url=$COMMENT_URL"
            exit 1
          fi
          echo "fork fallback left comment-url empty"
